<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Sử dụng vòng lặp While</h2>
    <p id="show"></p>
    <script>
        let num = prompt("Enter a number: ");
        let total = 0;

        while(num != -1){
            num = prompt("Enter a number: ");
            alert(num);
            total += parseInt(num);
        }

        const show = document.getElementById('show');
        show.innerText = `Sum of entered numbers: ${total}`;

        let i = 1;
        while(i <= 100){
            document.write("<hr width = " + i + "%>");
            i++;
        }
    </script>
</body>
</html>
