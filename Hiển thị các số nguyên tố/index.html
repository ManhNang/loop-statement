<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numbers = parseInt(prompt("Nhập số lượng số nguyên tố: ", 0));
        let count = 0;
        let n = 2;

        function isPrime(num){
            if(num < 2) return false;
            for(let i = 2; i <= Math.sqrt(num); i++){
                if(num % i === 0){
                    return false;
                }
            }
            return true;
        }

        while(count < numbers){
            if(isPrime(n)){
                document.writeln(`${n} là số nguyên tố <br>`);
                count++;
            }
            n++;
        }
    </script>
</body>
</html>
